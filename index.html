<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machine No. Row Filter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { margin-bottom: 12px; }
    input, button { padding: 8px; font-size: 14px; }
    button { cursor: pointer; margin-right: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    h2 { margin: 8px 0; }
    .muted { color: #666; font-size: 13px; }
    #status { margin-top: 8px; }
  </style>
</head>
<body>
  <h2 id="title">Engineer Tour Bill Date</h2>
  <div class="row">
    <label for="machineNo"><strong>Machine No. (exact):</strong></label><br />
    <input id="machineNo" type="text" placeholder="Example: M1023" />
    <button id="searchBtn">Search</button>
    <button id="downloadBtn" disabled>Download Excel</button>
  </div>
  <div class="muted">You can search again by typing a different machine number.</div>
  <div id="status" class="muted"></div>

  <table id="resultTable" hidden>
    <thead>
      <tr>
        <th>DATE</th><th>Location</th><th>Engineer Name</th><th>Workshop/Onsite</th><th>Call Type</th>
        <th>primary / secondary Engineer</th><th>Camplaint</th><th>Customer Name</th><th>Machine No.</th><th>HMR</th>
        <th>Brekdown status</th><th>Site's Location</th><th>call id</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1lXW_K5pN7kU4hThZI2u-5zWmnZFpvpjd0Xy9bvbcFhE/export?format=csv&gid=0';

    const REQUIRED_HEADERS = ['DATE', 'Location', 'Engineer Name', 'Workshop/Onsite', 'Call Type', 'primary / secondary Engineer', 'Camplaint', 'Customer Name', 'Machine No.', 'HMR', 'Brekdown status', "Site's Location", 'call id'];
    const machineInput = document.getElementById('machineNo');
    const searchBtn = document.getElementById('searchBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('status');
    const table = document.getElementById('resultTable');
    const tbody = table.querySelector('tbody');
    const titleEl = document.getElementById('title');

    let lastFilteredRows = [];

    function cleanHeader(value) {
      return String(value ?? '').toLowerCase().replace(/\s+/g, ' ').replace(/[.]/g, '').trim();
    }

    function findHeaderRowIndex(rows2d) {
      return rows2d.findIndex(row => row.some(cell => cleanHeader(cell).includes('machine no')));
    }

    function mapHeadersToIndex(headerRow) {
      const map = {};
      headerRow.forEach((h, idx) => {
        const key = cleanHeader(h);
        if (key) map[key] = idx;
      });
      return map;
    }

    function pick(row, headerMap, aliases) {
      for (const alias of aliases) {
        const idx = headerMap[cleanHeader(alias)];
        if (idx !== undefined) return row[idx] ?? '';
      }
      return '';
    }

    function parseRows(csvText) {
      const wb = XLSX.read(csvText, { type: 'string' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows2d = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      const headerIndex = findHeaderRowIndex(rows2d);
      if (headerIndex === -1) throw new Error('Header row not found in sheet.');

      const headerMap = mapHeadersToIndex(rows2d[headerIndex]);
      const dataRows = rows2d.slice(headerIndex + 1).filter(r => r.some(v => String(v).trim() !== ''));

      return dataRows.map(r => ({
        'DATE': pick(r, headerMap, ['Date', 'DATE']),
        'Location': pick(r, headerMap, ['Location', 'Branch', "Site's Location", 'Target Place']),
        'Engineer Name': pick(r, headerMap, ['Engineer Name', 'Name']),
        'Workshop/Onsite': pick(r, headerMap, ['Workshop/Onsite', 'Workshop Onsite', 'Workshop', 'Onsite']),
        'Call Type': pick(r, headerMap, ['Call Type', 'Type of Call']),
        'primary / secondary Engineer': pick(r, headerMap, ['primary / secondary Engineer', 'Primary Engineer', 'Secondary Engineer']),
        'Camplaint': pick(r, headerMap, ['Camplaint', 'Complaint']),
        'Customer Name': pick(r, headerMap, ['Customer Name', 'Customer']),
        'Machine No.': pick(r, headerMap, ['Machine No.', 'Machine No', 'Machine Number']),
        'HMR': pick(r, headerMap, ['HMR']),
        'Brekdown status': pick(r, headerMap, ['Brekdown status', 'Breakdown status', 'Machine Status']),
        "Site's Location": pick(r, headerMap, ["Site's Location", 'Site Location', 'Location']),
        'call id': pick(r, headerMap, ['call id', 'Call ID'])
      }));
    }

    function getTodayTitle() {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return `Engineer Tour Bill Date ${dd}-${mm}-${yyyy}`;
    }

    async function searchRows() {
      const machineNo = machineInput.value.trim();
      if (!machineNo) {
        statusEl.textContent = 'Please enter a machine number.';
        return;
      }

      statusEl.textContent = 'Loading data from Google Sheet...';
      tbody.innerHTML = '';
      table.hidden = true;
      downloadBtn.disabled = true;
      lastFilteredRows = [];

      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('Could not fetch Google Sheet. Ensure it is shared publicly/viewable.');
        const csvText = await res.text();
        const allRows = parseRows(csvText);
        const filtered = allRows.filter(r => String(r['Machine No.']).trim() === machineNo);
        lastFilteredRows = filtered;

        if (!filtered.length) {
          statusEl.textContent = `No rows found for Machine No. "${machineNo}".`;
          return;
        }

        filtered.forEach(row => {
          const tr = document.createElement('tr');
          REQUIRED_HEADERS.forEach(h => {
            const td = document.createElement('td');
            td.textContent = row[h] ?? '';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        table.hidden = false;
        downloadBtn.disabled = false;
        statusEl.textContent = `${filtered.length} row(s) found for Machine No. "${machineNo}".`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    function downloadExcel() {
      if (!lastFilteredRows.length) return;
      const ws = XLSX.utils.json_to_sheet(lastFilteredRows, { header: REQUIRED_HEADERS });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'SelectedRows');
      XLSX.writeFile(wb, 'selected_machine_rows.xlsx');
    }

    titleEl.textContent = getTodayTitle();
    searchBtn.addEventListener('click', searchRows);
    machineInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchRows(); });
    downloadBtn.addEventListener('click', downloadExcel);
  </script>
</body>
</html>
